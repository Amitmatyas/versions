<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>פורטל לקוח</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        /* הועתק העיצוב הניאו-ברוטליסטי הבהיר מהאדמין לטובת הלקוח */
        :root { 
            --bg: #f4f4f5; 
            --panel-bg: #ffffff;
            --fg: #000000; 
            --border: 3px solid #000; 
            --radius: 8px;
            --shadow: 5px 5px 0px #000;
            --shadow-hover: 2px 2px 0px #000;
        }
        
        * { box-sizing: border-box; font-family: 'Heebo', sans-serif; }
        body { background: var(--bg); color: var(--fg); margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        
        h1, h2, h3 { font-weight: 800; letter-spacing: 1px; text-transform: uppercase; margin-top: 0; }
        
        button { background: var(--bg); color: var(--fg); border: var(--border); border-radius: var(--radius); padding: 12px 24px; font-weight: 800; font-size: 16px; cursor: pointer; transition: 0.1s ease-in-out; box-shadow: var(--shadow); }
        button:hover { transform: translate(3px, 3px); box-shadow: var(--shadow-hover); background: #e0e0e0; }
        button:active { transform: translate(5px, 5px); box-shadow: 0px 0px 0px #000; }
        button:disabled { border-color: #888; color: #888; box-shadow: 5px 5px 0px #888; cursor: not-allowed; background: #ddd; }
        
        textarea { border: var(--border); border-radius: var(--radius); padding: 15px; width: 100%; background: var(--panel-bg); color: var(--fg); outline: none; resize: vertical; font-size: 16px; font-weight: 600; transition: 0.2s; }
        textarea:focus { box-shadow: var(--shadow); transform: translate(-2px, -2px); }

        .container { width: 100%; max-width: 1000px; padding: 50px 20px; animation: fadeIn 0.8s ease; }
        .header { border-bottom: var(--border); padding-bottom: 25px; margin-bottom: 50px; display: flex; justify-content: space-between; align-items: center; }
        
        .file-list { display: flex; flex-direction: column; gap: 30px; }
        .file-item { background: var(--panel-bg); border: var(--border); border-radius: var(--radius); padding: 30px; display: flex; justify-content: space-between; align-items: center; transition: 0.3s; box-shadow: var(--shadow); }
        .file-item:hover { transform: translate(-5px, -5px); box-shadow: 10px 10px 0 #000; }
        
        /* Modals & Notifications */
        .notification-center { display: none; position: absolute; top: 110px; left: 20px; width: 350px; background: var(--panel-bg); border: var(--border); border-radius: var(--radius); box-shadow: -8px 8px 0 #000; padding: 20px; z-index: 100; max-height: 400px; overflow-y: auto; text-align: right; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .modal-content { background: var(--panel-bg); border: var(--border); border-radius: var(--radius); padding: 35px; width: 95%; max-width: 1200px; height: 90vh; display: flex; flex-direction: column; animation: slideUp 0.4s ease; box-shadow: 12px 12px 0 #000; }
        .close-btn { align-self: flex-end; cursor: pointer; font-size: 24px; font-weight: 800; background: #000; color: #fff; width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; border-radius: 50%; margin-bottom: 15px; transition: 0.2s; }
        .close-btn:hover { background: #d32f2f; transform: rotate(90deg); }
        
        .preview-container { position: relative; flex-grow: 1; border: var(--border); border-radius: var(--radius); margin-bottom: 25px; overflow: hidden; box-shadow: inset 0 0 10px rgba(0,0,0,0.2); background: #eee; }
        iframe { width: 100%; height: 100%; border: none; background: #fff; }
        
        .fs-btn { position: absolute; top: 15px; right: 15px; height: 45px; background: #000; color: #fff; border: 3px solid #000; border-radius: 8px; overflow: hidden; white-space: nowrap; transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); width: 160px; display: flex; align-items: center; justify-content: center; z-index: 10; box-shadow: 3px 3px 0 #fff; font-size: 15px; font-weight: 800; }
        .fs-btn.collapsed { width: 45px; padding: 0; justify-content: center; }
        .fs-btn span { transition: opacity 0.3s; }
        .fs-btn.collapsed span { opacity: 0; display: none; }
        .fs-btn::before { content: '⤢'; font-size: 20px; font-weight: 800; margin-left: 8px; }
        .fs-btn.collapsed::before { margin-left: 0; }

        .action-area { display: grid; grid-template-columns: 3fr 1fr; gap: 30px; }
        
        .history-list { list-style: none; padding: 0; }
        .history-list li { border-bottom: 2px dashed #000; padding: 20px 0; display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: 600; }
        .history-list li:last-child { border-bottom: none; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1 id="welcomeTitle">טוען נתונים...</h1>
            <div>
                <button onclick="window.toggleClientNotifications()">התראות <span id="clientNotifCount" style="background:#000; color:#fff; padding:2px 6px; border-radius:4px;">0</span></button>
            </div>
        </div>
        
        <div class="notification-center" id="clientNotifCenter">
            <h3>הודעות מהאדמין</h3>
            <div id="clientNotifList"></div>
        </div>

        <div class="file-list" id="fileList"></div>
    </div>

    <!-- Modal: View History -->
    <div class="modal" id="historyModal">
        <div class="modal-content" style="max-width: 700px; height: auto;">
            <span class="close-btn" onclick="window.closeModal('historyModal')">X</span>
            <h2 style="border-bottom: 3px solid #000; padding-bottom: 15px;">היסטוריית גרסאות</h2>
            <ul class="history-list" id="historyList"></ul>
        </div>
    </div>

    <!-- Modal: Preview & Actions -->
    <div class="modal" id="previewModal">
        <div class="modal-content">
            <span class="close-btn" onclick="window.closeModal('previewModal')">X</span>
            <h2 id="previewTitle" style="margin-top: 0; display: inline-block; padding-bottom: 10px; border-bottom: 3px solid #000;"></h2>
            
            <div class="preview-container">
                <button class="fs-btn" id="fsBtn" onclick="window.openFullscreen()"><span>מסך מלא</span></button>
                <iframe id="siteIframe"></iframe>
            </div>

            <div class="action-area">
                <div>
                    <textarea id="commentText" rows="3" placeholder="השאר הערה לגרסה זו..."></textarea>
                    <button onclick="window.sendComment()" style="margin-top: 15px; width: 100%; background: #000; color: #fff;">שלח הערה לאדמין</button>
                    <div id="commentsDisplay" style="margin-top: 25px; font-size: 16px; color: #333;"></div>
                </div>
                <div style="display: flex; flex-direction: column; justify-content: flex-end;">
                    <button id="approveBtn" onclick="window.approveVersion()" style="height: 100%; font-size: 22px;">אישור גרסה ✅</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBr4kDzw3n5PDu2pbZ3MItnCxi8YJFCRIQ",
            authDomain: "schoolmangers.firebaseapp.com",
            databaseURL: "https://schoolmangers-default-rtdb.firebaseio.com",
            projectId: "schoolmangers",
            storageBucket: "schoolmangers.firebasestorage.app",
            messagingSenderId: "894509181268",
            appId: "1:894509181268:web:c8ac6305f23fa003e3c0c1",
            measurementId: "G-BE0R2WQ35J"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let globalData = { clients: {}, files: {}, versions: {}, comments: {}, notifications: {} };
        let client = null;
        let currentVersionView = null;
        let fsTimeout = null;

        function getArr(obj) { return Object.values(obj || {}); }

        onValue(ref(db, '/'), (snapshot) => {
            const data = snapshot.val();
            if (data) {
                globalData = {
                    clients: data.clients || {},
                    files: data.files || {},
                    versions: data.versions || {},
                    comments: data.comments || {},
                    notifications: data.notifications || {}
                };
                initClientView();
                
                if(currentVersionView && globalData.versions[currentVersionView.id]) {
                    currentVersionView = globalData.versions[currentVersionView.id];
                    renderComments();
                    updateApproveBtnUI();
                }
            }
        });

        function normalizeForCompare(str) {
            // מסיר רווחים, מקפים, קווים תחתונים וכו', והופך לאותיות קטנות - כדי לתפוס "כל וריאציה" של השם
            return (str || '').toLowerCase().replace(/[^a-z0-9\u0590-\u05FF]/g, '');
        }

        function isReferrerAuthorized(clientName) {
            const referrer = document.referrer;
            if (!referrer) return false;

            let refUrl;
            try {
                refUrl = new URL(referrer);
            } catch (e) {
                return false;
            }

            // הכתובת שממנה הגיעו חייבת להכיל את שם הלקוח, בכל וריאציה (רווחים/מקפים/אותיות גדולות-קטנות)
            const nameOk = normalizeForCompare(referrer).includes(normalizeForCompare(clientName));

            return nameOk;
        }

        function initClientView() {
            const hash = decodeURIComponent(window.location.hash.substring(1));
            client = getArr(globalData.clients).find(c => c.name === hash);
            
            if(!client) {
                document.getElementById('welcomeTitle').innerText = 'לקוח לא נמצא.';
                document.getElementById('fileList').innerHTML = '';
                return;
            }

            if (!isReferrerAuthorized(client.name)) {
                document.getElementById('welcomeTitle').innerText = 'הגישה חסומה.';
                document.getElementById('fileList').innerHTML = '';
                client = null;
                return;
            }
            
            document.getElementById('welcomeTitle').innerText = `שלום, ${client.name}`;
            renderFiles();
            renderClientNotifications();
        }

        function renderFiles() {
            const list = document.getElementById('fileList');
            list.innerHTML = '';
            const files = getArr(globalData.files).filter(f => f.clientId === client.id);
            
            if(files.length === 0) list.innerHTML = '<p style="text-align:center; font-size:20px; font-weight:800;">אין קבצים זמינים כרגע.</p>';

            files.forEach(f => {
                const v = getVisibleVersions(f.id);
                const latest = v.length > 0 ? v[v.length - 1] : null;
                
                const div = document.createElement('div');
                div.className = 'file-item';
                div.innerHTML = `
                    <div>
                        <h2>${f.displayName}</h2>
                        <span style="color: #555; font-weight:800;">${latest ? `גרסה ${latest.version}` : 'טרם הועלתה גרסה'}</span>
                    </div>
                    <div style="display:flex; gap:15px;">
                        ${latest ? `<button onclick="window.openHistory('${f.id}')">היסטוריית גרסאות</button>
                                   <button onclick="window.openPreview('${latest.id}', '${f.displayName}')" style="background:#000; color:#fff;">צפה בגרסה עדכנית</button>` : ''}
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function getVisibleVersions(fileId) {
            return getArr(globalData.versions).filter(v => v.fileId === fileId && !v.isHidden);
        }

        window.openHistory = function(fileId) {
            const file = globalData.files[fileId];
            const versions = getVisibleVersions(fileId);
            const list = document.getElementById('historyList');
            list.innerHTML = '';
            
            versions.forEach(v => {
                list.innerHTML += `
                    <li>
                        <span><strong>גרסה ${v.version}</strong> ${v.status === 'approved' ? '✅' : ''}</span>
                        <button onclick="window.openPreview('${v.id}', '${file.displayName}')">פתח תצוגה</button>
                    </li>
                `;
            });
            document.getElementById('historyModal').style.display = 'flex';
        }

        window.openPreview = function(versionId, displayName) {
            currentVersionView = globalData.versions[versionId];
            document.getElementById('historyModal').style.display = 'none';
            document.getElementById('previewModal').style.display = 'flex';
            
            document.getElementById('previewTitle').innerText = `${displayName} - גרסה ${currentVersionView.version}`;
            document.getElementById('siteIframe').src = currentVersionView.url;
            
            updateApproveBtnUI();

            const fsBtn = document.getElementById('fsBtn');
            fsBtn.classList.remove('collapsed');
            clearTimeout(fsTimeout);
            fsTimeout = setTimeout(() => {
                fsBtn.classList.add('collapsed');
            }, 5000);

            renderComments();
        }

        function updateApproveBtnUI() {
            const appBtn = document.getElementById('approveBtn');
            if(currentVersionView.status === 'approved') {
                appBtn.innerText = 'אושר! ✅';
                appBtn.disabled = true;
            } else {
                appBtn.innerText = 'אישור גרסה ✅';
                appBtn.disabled = false;
            }
        }

        function renderComments() {
            const comms = getArr(globalData.comments).filter(c => c.versionId === currentVersionView.id);
            let html = '';
            comms.forEach(c => {
                const isAdmin = c.author === 'admin';
                html += `<div style="margin-bottom: 10px; background:#fff; padding:12px; border-radius:6px; border: 2px solid #000; font-weight:600;"><strong style="color:${isAdmin ? '#fff' : '#000'}; background:${isAdmin ? '#000' : '#e0e0e0'}; padding:3px 8px; border-radius:4px; margin-left:8px; border: 1px solid #000;">${isAdmin ? 'אדמין' : 'אני'}</strong> ${c.text}</div>`;
            });
            document.getElementById('commentsDisplay').innerHTML = html;
        }

        window.sendComment = function() {
            const text = document.getElementById('commentText').value.trim();
            if(!text) return;
            
            const cId = 'cm_' + Date.now();
            set(ref(db, 'comments/' + cId), { id: cId, versionId: currentVersionView.id, text: text, author: 'client' });
            
            const file = globalData.files[currentVersionView.fileId];
            const nId = 'n_' + Date.now();
            
            // שליחה התראה שמוגדרת ספציפית לאדמין (target: admin)
            set(ref(db, 'notifications/' + nId), { 
                id: nId, 
                text: `💬 הערה חדשה מ-${client.name} בקובץ ${file.physicalName} (v${currentVersionView.version})`, 
                read: false,
                target: 'admin'
            });
            
            document.getElementById('commentText').value = '';
        }

        window.approveVersion = function() {
            if(!confirm('האם אתה בטוח שברצונך לאשר גרסה זו? לא ניתן לבטל פעולה זו.')) return;
            
            update(ref(db, `versions/${currentVersionView.id}`), { status: 'approved' });
            
            const file = globalData.files[currentVersionView.fileId];
            const nId = 'n_' + Date.now();
            
            set(ref(db, 'notifications/' + nId), { 
                id: nId, 
                text: `✅ הלקוח ${client.name} אישר את הקובץ ${file.physicalName} (v${currentVersionView.version})`, 
                read: false,
                target: 'admin'
            });
        }

        // --- Notifications Logic for Client ---
        window.toggleClientNotifications = function() {
            const nc = document.getElementById('clientNotifCenter');
            nc.style.display = nc.style.display === 'block' ? 'none' : 'block';
        }

        function renderClientNotifications() {
            if(!client) return;
            const list = document.getElementById('clientNotifList');
            list.innerHTML = '';
            
            const clientNotifs = getArr(globalData.notifications).filter(n => n.target === 'client' && n.clientId === client.id).reverse();
            
            clientNotifs.forEach(n => {
                const div = document.createElement('div');
                div.style = `border-bottom: 2px solid #eee; padding: 15px 0; ${!n.read ? 'font-weight: 800; background:#f0f0f0; padding:15px;' : ''} border-radius: 4px; margin-bottom: 5px;`;
                div.innerHTML = `${n.text} <br><button style="margin-top:10px; font-size:12px; padding:5px 10px;" onclick="window.markClientRead('${n.id}')">סמן כנקרא</button>`;
                list.appendChild(div);
            });
            
            const unread = clientNotifs.filter(n => !n.read).length;
            document.getElementById('clientNotifCount').innerText = unread;
        }

        window.markClientRead = function(id) {
            update(ref(db, `notifications/${id}`), { read: true });
        }

        window.openFullscreen = function() {
            window.open(currentVersionView.url, '_blank');
        }

        window.closeModal = function(id) {
            document.getElementById(id).style.display = 'none';
            if(id === 'previewModal') {
                document.getElementById('siteIframe').src = '';
                currentVersionView = null;
            }
        }

        window.addEventListener('hashchange', initClientView);
    </script>
</body>
</html>
